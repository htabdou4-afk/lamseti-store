<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" fill="none">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fff8f6"/><stop offset="1" stop-color="#eadce9"/></linearGradient>
 <linearGradient id="berry" x2="1" y2="1"><stop stop-color="#b85d83"/><stop offset="1" stop-color="#713b59"/></linearGradient>
 <linearGradient id="pink" x2="1" y2="1"><stop stop-color="#f8dce6"/><stop offset="1" stop-color="#dba9bf"/></linearGradient>
 <linearGradient id="gold" x2="1" y2="1"><stop stop-color="#f5dfb8"/><stop offset="1" stop-color="#b98759"/></linearGradient>
 <filter id="shadow"><feGaussianBlur stdDeviation="22"/></filter>
 <pattern id="texture" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#b8879d" opacity=".16"/></pattern>
</defs>
<rect width="1200" height="900" rx="34" fill="url(#bg)"/>
<rect width="1200" height="900" rx="34" fill="url(#texture)"/>
<circle cx="1010" cy="160" r="190" fill="#fff" opacity=".48"/>
<circle cx="130" cy="730" r="230" fill="#e6c9d8" opacity=".35"/>
<path d="M0 740q260-100 470-20t730-20v200H0z" fill="#ead8e4" opacity=".65"/>
<!-- flowers -->
<g transform="translate(980 115)" fill="#d48ba7" opacity=".58">
 <ellipse cx="0" cy="-35" rx="17" ry="34"/><ellipse cx="33" cy="0" rx="17" ry="34" transform="rotate(90 33 0)"/><ellipse cx="0" cy="35" rx="17" ry="34"/><ellipse cx="-33" cy="0" rx="17" ry="34" transform="rotate(90 -33 0)"/><circle r="13" fill="#d9ad78"/>
</g>
<g transform="translate(175 185)" fill="#e4a8bd" opacity=".48"><ellipse cy="-24" rx="12" ry="24"/><ellipse cx="24" rx="12" ry="24" transform="rotate(90 24 0)"/><ellipse cy="24" rx="12" ry="24"/><ellipse cx="-24" rx="12" ry="24" transform="rotate(90 -24 0)"/><circle r="9" fill="#c59a70"/></g>
<ellipse cx="600" cy="735" rx="420" ry="62" fill="#57384c" opacity=".18" filter="url(#shadow)"/>
<!-- main planner -->
<g transform="rotate(-8 500 430)">
 <rect x="270" y="150" width="470" height="590" rx="25" fill="#6b3b55" opacity=".2" transform="translate(18 20)"/>
 <rect x="270" y="150" width="470" height="590" rx="25" fill="url(#berry)"/>
 <rect x="298" y="180" width="414" height="530" rx="12" stroke="#e9c9b3" stroke-width="2" opacity=".8"/>
 <path d="M325 220h360" stroke="url(#gold)" stroke-width="3"/>
 <text x="505" y="375" fill="#fff5f1" font-family="Georgia,serif" font-size="48" text-anchor="middle" letter-spacing="5">LAMSETI</text>
 <text x="505" y="418" fill="#f2dce4" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" letter-spacing="5">YOUR IDEAS, BEAUTIFULLY MADE</text>
 <path d="M430 468h150" stroke="url(#gold)" stroke-width="2"/>
 <path d="M505 500c-30-35-70 8 0 63 70-55 30-98 0-63Z" fill="none" stroke="url(#gold)" stroke-width="3"/>
 <text x="505" y="635" fill="#f0d9e2" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" letter-spacing="4">PERSONALIZED NOTEBOOK</text>
</g>
<!-- smaller blush notebook -->
<g transform="rotate(10 850 485)">
 <rect x="760" y="310" width="260" height="360" rx="18" fill="#a47b8d" opacity=".25" transform="translate(10 12)"/>
 <rect x="760" y="310" width="260" height="360" rx="18" fill="url(#pink)" stroke="#fff5f0" stroke-width="3"/>
 <rect x="780" y="330" width="220" height="320" rx="9" stroke="#fff8f4" stroke-width="2"/>
 <text x="890" y="445" fill="#78465f" font-family="Georgia,serif" font-size="29" text-anchor="middle" letter-spacing="3">NOTES</text>
 <path d="M835 480h110M835 510h110M835 540h110" stroke="#b77c96" stroke-width="2" opacity=".6"/>
 <path d="M815 350v280" stroke="#b87591" stroke-width="4" stroke-dasharray="2 15"/>
</g>
<!-- business cards -->
<g transform="rotate(7 840 740)">
 <rect x="690" y="680" width="310" height="165" rx="12" fill="#60344d" opacity=".18" transform="translate(9 10)"/>
 <rect x="690" y="680" width="310" height="165" rx="12" fill="#fffaf5" stroke="#d8b18b" stroke-width="2"/>
 <text x="845" y="745" fill="#713b59" font-family="Georgia,serif" font-size="25" text-anchor="middle" letter-spacing="2">ROSE BOUTIQUE</text>
 <text x="845" y="778" fill="#b06d8a" font-family="Arial,sans-serif" font-size="11" text-anchor="middle" letter-spacing="3">BUSINESS CARD</text>
 <path d="M770 800h150" stroke="#d3adbd" stroke-width="1.5"/>
</g>
<!-- gold pen -->
<g transform="rotate(28 190 540)"><rect x="180" y="400" width="17" height="260" rx="8" fill="url(#gold)"/><path d="M180 410h17" stroke="#fff0d7" stroke-width="3"/><path d="M180 645l8 25 9-25" fill="#9a6b73"/></g>
<text x="600" y="860" fill="#87576f" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" letter-spacing="5">PRINT · DESIGN · PERSONALIZE</text>
</svg>