<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
<title id="title">دفتر LAMSETI بتصميم وردي</title><desc id="desc">دفتر مخصص بغلاف وردي توتي وتفاصيل شامبانيا ذهبية مع قلم وزخارف ناعمة.</desc>
<style>
  .notebook-main,.notebook-pen,.notebook-note{transform-box:fill-box;transform-origin:center;transition:translate .8s cubic-bezier(.2,.75,.25,1)}
