  svg:hover .notebook-pen{translate:0 -23px}
  svg:hover .notebook-note{translate:0 -10px}
  svg:active .notebook-main{translate:0 -10px}
  svg:active .notebook-pen{translate:0 -15px}
  svg:active .notebook-note{translate:0 -7px}
  @media(prefers-reduced-motion:reduce){.notebook-main,.notebook-pen,.notebook-note{transition:none!important}}
</style>
