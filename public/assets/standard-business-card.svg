<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
<title id="title">نماذج بطاقات أعمال لمشاريع نسائية</title>
<desc id="desc">بطاقات أنيقة بألوان الوردي البودري والتوتي والعاجي، مخصصة لبوتيك وبيوتي ستوديو ومشروع حلويات.</desc>
<style>
  .business-card-back,.business-card-front{transform-box:fill-box;transform-origin:center;transition:translate .8s cubic-bezier(.2,.75,.25,1)}
  svg:hover .business-card-back{translate:0 -22px}
  svg:hover .business-card-front{translate:0 -10px}
  svg:active .business-card-back{translate:0 -15px}
  svg:active .business-card-front{translate:0 -7px}
  @media(prefers-reduced-motion:reduce){.business-card-back,.business-card-front{transition:none!important}}
</style>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fff8f5"/><stop offset="1" stop-color="#f0e5ef"/></linearGradient>
 <linearGradient id="berry" x2="1" y2="1"><stop stop-color="#a94d75"/><stop offset="1" stop-color="#693650"/></linearGradient>
 <linearGradient id="blush" x2="1" y2="1"><stop stop-color="#f8dfe7"/><stop offset="1" stop-color="#e9bdcf"/></linearGradient>
 <linearGradient id="foil" x2="1" y2="1"><stop stop-color="#f6dfb9"/><stop offset=".5" stop-color="#b98759"/><stop offset="1" stop-color="#f7e7ca"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feGaussianBlur stdDeviation="17"/></filter>
 <pattern id="grain" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 3h10" stroke="#c8a6b4" stroke-opacity=".15"/></pattern>
</defs>
<rect width="900" height="620" rx="28" fill="url(#bg)"/>
<circle cx="120" cy="125" r="100" fill="#fff" opacity=".6"/>
<path d="M0 500q180-80 350 0t550-25v145H0z" fill="#ead9e5" opacity=".55"/>
<g fill="none" stroke="#c98da7" stroke-width="2" opacity=".48"><path d="M760 80q-60 45-25 105t-35 85"/><path d="M740 150q-50-24-70 9m75-16q35-42 67-26"/><path d="M100 430q45-45 82-10m-45-5q-4-35 22-51"/></g>
<ellipse cx="455" cy="390" rx="340" ry="135" fill="#684257" opacity=".17" filter="url(#shadow)"/>
<!-- Boutique card -->
<g class="business-card-back" transform="rotate(-8 430 230)">
 <rect x="150" y="85" width="550" height="300" rx="16" fill="#6b3b55" opacity=".22" transform="translate(12 14)"/>
 <rect x="150" y="85" width="550" height="300" rx="16" fill="url(#berry)" stroke="#d8b18b" stroke-width="2"/>
 <rect x="170" y="105" width="510" height="260" rx="8" fill="none" stroke="#e8c9b1" stroke-width="1.5" opacity=".8"/>
 <g transform="translate(260 160)" fill="none" stroke="url(#foil)" stroke-width="2.5"><path d="M0 42c-30-28-49 14 0 48 49-34 30-76 0-48Z"/><path d="M0 25v76"/></g>
 <text x="515" y="205" text-anchor="middle" font-size="31" fill="#fff2ec" font-family="Georgia,serif" font-size="39" letter-spacing="4">ROSE BOUTIQUE</text>
 <text x="515" y="239" text-anchor="middle" font-size="11" fill="#f0d7df" font-family="Arial,sans-serif" font-size="13" letter-spacing="4">FASHION · ACCESSORIES</text>
 <path d="M405 265h220" stroke="url(#foil)" stroke-width="1.5"/>
 <text x="515" y="300" text-anchor="middle" font-size="13" fill="#fff2ec" font-family="Arial,sans-serif" font-size="15">YOUR NAME · FOUNDER</text>
 <text x="515" y="327" text-anchor="middle" font-size="11" fill="#efd8df" font-family="Arial,sans-serif" font-size="12">+213 555 000 000</text>
</g>
<!-- Beauty card -->
<g class="business-card-front" transform="rotate(8 430 440)">
 <rect x="185" y="365" width="520" height="205" rx="15" fill="#c8a7b6" opacity=".45" transform="translate(9 10)"/>
 <rect x="185" y="365" width="520" height="205" rx="15" fill="#fffaf5" stroke="#d8c3c9" stroke-width="2"/>
 <rect x="203" y="383" width="484" height="169" rx="8" fill="url(#grain)" stroke="#e6d4d9"/>
 <circle cx="285" cy="465" r="47" fill="url(#blush)"/>
 <path d="M285 430c-25 23-19 55 0 69 19-14 25-46 0-69Z" fill="none" stroke="#9f5b78" stroke-width="2"/>
 <path d="M285 443v47" stroke="#9f5b78" stroke-width="2"/>
 <text x="515" y="447" text-anchor="middle" font-size="27" fill="#713b59" font-family="Georgia,serif" font-size="32" letter-spacing="2">LINA BEAUTY</text>
 <text x="515" y="476" text-anchor="middle" font-size="11" fill="#a36f86" font-family="Arial,sans-serif" font-size="13" letter-spacing="3">BEAUTY STUDIO</text>
 <path d="M405 495h220" stroke="#d9b7c5"/>
 <text x="515" y="521" text-anchor="middle" font-size="11" fill="#775b6a" font-family="Arial,sans-serif" font-size="13">Instagram · Phone · Address</text>
</g>

</svg>